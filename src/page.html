<title>Mother Tongues</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: one full-height stage. The map is the page; a timeline docks below it, a reading panel docks right; stories open as a scrolling layer above. */
:root{
  --bg:#fbfbf9; --surface:#ffffff; --fg:#1d1e20; --muted:#6a6c70; --faint:#b9bbb7; --land:#c3c5c1; --line:#e3e3de;
  --accent:#d6452b; --ga:#1d8659; --haw:#2263a6; --mori:#cf962a; --near:#d6452b; --ext:#8b8d90;
  --paper:#f2efe7; --ink:#2b2824; --mark:rgba(214,69,43,.16); --shadow:0 10px 30px rgba(20,20,25,.08),0 1px 2px rgba(20,20,25,.06);
  --serif:"Spectral",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1b1c1f; --fg:#ebeae6; --muted:#9b9ca0; --faint:#4a4c50; --land:#46484c; --line:#2a2c30;
  --accent:#f0644a; --ga:#45b884; --haw:#5d9fe2; --mori:#e2b14c; --near:#f0644a; --ext:#8c8e91;
  --paper:#24221f; --ink:#e8e2d6; --mark:rgba(240,100,74,.22); --shadow:0 10px 30px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1b1c1f; --fg:#ebeae6; --muted:#9b9ca0; --faint:#4a4c50; --land:#46484c; --line:#2a2c30;
  --accent:#f0644a; --ga:#45b884; --haw:#5d9fe2; --mori:#e2b14c; --near:#f0644a; --ext:#8c8e91;
  --paper:#24221f; --ink:#e8e2d6; --mark:rgba(240,100,74,.22); --shadow:0 10px 30px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted)}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.ring{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}

/* ---------- app frame ---------- */
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr) auto;transition:grid-template-columns .5s ease}
#app.region{grid-template-columns:minmax(0,1fr) min(440px,38vw)}
#stage{position:relative;grid-column:1;grid-row:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
header.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:24px;justify-content:space-between;padding:22px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));pointer-events:none;z-index:3}
header.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b .dot{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font:inherit}
.crumb button:hover{color:var(--fg)}
.crumb span{color:var(--fg)}
.counter{text-align:right;max-width:280px}
.counter .n{font-family:var(--serif);font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.counter .mono{display:block;margin-top:4px;line-height:1.4}
#legend{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:78px;display:grid;gap:6px;z-index:2;font-family:var(--mono);font-size:12px;color:var(--fg)}
#legend .row{display:flex;align-items:center;gap:9px}
#legend hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:150px}
#legend .k{color:var(--muted)}

/* globe-mode search */
#find{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:grid;gap:12px;justify-items:center;z-index:3;transition:opacity .4s}
#app.away #find{opacity:0;pointer-events:none}
.search{position:relative;width:100%}
.search input[type=text]{width:100%;box-sizing:border-box;height:56px;border-radius:28px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:17px;padding:0 20px 0 54px;box-shadow:var(--shadow)}
.search input[type=text]::placeholder{color:var(--muted)}
.search svg{position:absolute;left:22px;top:20px}
#results{position:absolute;bottom:64px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:6px}
#results button{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px}
#results button:hover,#results button.on{background:var(--bg)}
#results .mono{flex:none}
.starts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.starts button{background:none;border:0;display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px;padding:4px 2px}
.starts button:hover span{text-decoration:underline;text-underline-offset:3px}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}

/* tooltip & pinned card on map */
#tip{position:absolute;z-index:4;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;min-width:200px;max-width:280px;font-size:14px}
#tip.pinned{pointer-events:auto}
#tip h4{margin:0 0 2px;font-weight:500;font-size:15px}
#tip .row{display:flex;gap:8px;align-items:center;margin-top:6px}
#tip button{margin-top:10px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
#tip button:hover{border-color:var(--fg)}

/* ---------- timeline ---------- */
#time{grid-column:1;grid-row:2;display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:end;gap:22px;padding:10px max(24px,env(safe-area-inset-right,0px)) 18px max(24px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:3}
.yearbox{min-width:150px}
#year{font-family:var(--serif);font-size:64px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#yearNote{display:flex;align-items:center;gap:7px;margin-top:6px;min-height:18px;white-space:nowrap}
#play{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-bottom:14px}
#play:hover{border-color:var(--fg)}
.trackwrap{position:relative;min-width:0}
.trackhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:2px}
#track{width:100%;height:92px;display:block;touch-action:none;cursor:pointer;overflow:visible}
#track text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
#pop{position:absolute;bottom:100px;transform:translateX(-50%);width:300px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;z-index:6}
#pop h5{font-family:var(--serif);font-weight:400;font-size:21px;line-height:1.2;margin:6px 0 6px;text-wrap:balance}
#pop p{margin:0;color:var(--muted);font-size:14px}
#pop .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--muted);font-size:18px}
#pop .src{margin-top:10px}

/* ---------- panel ---------- */
#panel{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);background:var(--surface);overflow:auto;min-width:0;position:relative;z-index:4}
#panel .in{padding:28px 30px 120px;display:grid;gap:22px}
#panel h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
#panel h2 em{color:var(--muted);font-style:normal}
.close{position:absolute;right:18px;top:18px;background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.warn{border-color:transparent;background:color-mix(in srgb,var(--mori) 18%,transparent);color:var(--fg)}
.chip.crit{border-color:transparent;background:color-mix(in srgb,var(--near) 15%,transparent)}
.lede{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0}
.now{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.now .big{font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.now .big small{font-family:var(--sans);font-size:14px;color:var(--muted)}
.sec{display:grid;gap:12px}
.sec>.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.lost{display:grid;gap:0}
.lost .it{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);transition:opacity .6s,filter .6s}
.lost .it:last-child{border-bottom:1px solid var(--line)}
.lost .w{font-family:var(--serif);font-size:20px;line-height:1.2}
.lost .k{grid-row:1/3;padding-top:5px;width:74px}
.lost .m{font-size:14px;color:var(--muted)}
.gaps{display:grid;gap:8px}
.gapbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px dashed var(--faint);border-radius:12px;padding:12px 14px}
.gapbtn:hover{border-color:var(--fg)}
.gapbtn b{font-weight:500;font-size:14px;display:block}
.gapbtn .mono{display:block;margin-top:2px}
.state{font-family:var(--mono);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st-un .ring{border-style:dashed;color:var(--muted)}
.st-ai .ring{color:var(--mori)}
.st-ok .dot{color:var(--ga)}
.stories{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.story{display:grid;gap:6px;min-width:0}
.story .thumb{aspect-ratio:4/3;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center}
.story .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.story .thumb audio{width:92%}
.story .thumb .q{font-family:var(--serif);font-size:15px;line-height:1.35;padding:14px;color:var(--fg)}
.story b{font-weight:500;font-size:14px;line-height:1.3}
.story .ex{position:absolute;left:8px;top:8px}
.empty{border:1px dashed var(--faint);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.ctas{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 30px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--surface) 70%,transparent)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:10px;height:52px;border-radius:26px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:500;font-size:15px;padding:0 20px}
.btn .dot{color:var(--accent)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.sm{height:38px;font-size:14px;padding:0 14px}
.linkish{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transition:opacity .6s ease}
.layer.fade{opacity:0;pointer-events:none}

/* intro */
/* language intro: covers the map stage after the zoom, then fades back into it */
.lintro{position:absolute;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;padding:84px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(3px);opacity:0;transition:opacity .9s ease,transform .9s ease,filter .9s ease}
.lintro.on{opacity:1}
.lintro.out{opacity:0;transform:scale(.97);filter:blur(6px);pointer-events:none}
.lbar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent)}
.vnote{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:26px 0 8px}
.vplay{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.vplay:hover{border-color:var(--fg)}
.vwave{width:100%;height:56px;display:block}
.vtime{font-variant-numeric:tabular-nums;white-space:nowrap}
.globestat{font-size:14px;text-align:center;color:var(--fg)}
.globestat b{font-family:var(--serif);font-weight:500;font-size:17px}
.intro{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:center}
.intro .plate{aspect-ratio:4/5}
.intro blockquote{margin:0;font-family:var(--serif);font-size:clamp(28px,3.6vw,44px);line-height:1.15;text-wrap:balance}
.intro blockquote i{display:block;color:var(--muted);font-size:.62em;line-height:1.35;margin-top:14px;font-style:italic}
.intro .attr{margin-top:12px}
.intro .stat{font-size:16px;margin:22px 0 0;max-width:46ch}
.intro .stat b{font-family:var(--serif);font-weight:500;font-size:20px}
.intro .go{display:flex;gap:16px;align-items:center;margin-top:28px;flex-wrap:wrap}

/* halftone plate */
.plate{position:relative;border-radius:4px;overflow:hidden;background:var(--paper);width:100%;max-width:100%}
.plate canvas{position:absolute;inset:0;width:100%;height:100%}
.plate figcaption{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(to top,color-mix(in srgb,var(--paper) 92%,transparent),transparent);display:grid;gap:2px}
.plate figcaption .t{font-size:13px;color:var(--ink)}
.plate .drop{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.plate .drop:hover{color:var(--fg);border-color:var(--fg)}
.plate.over{outline:2px dashed var(--accent);outline-offset:-6px}

/* story: one sticky stage under the whole scroll; steps scroll over it */
#story .bar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:calc(14px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) 14px max(24px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
#story .bar .prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0}
.sx-stage{position:sticky;top:0;height:100vh;margin-bottom:-100vh;overflow:hidden;z-index:0}
.sx-map{position:absolute;inset:0;width:100%;height:100%;display:block}
.sx-hud{position:absolute;right:max(28px,env(safe-area-inset-right,0px));bottom:28px;text-align:right;transition:opacity .5s;pointer-events:none}
.sx-hud .y{font-family:var(--serif);font-size:clamp(56px,8vw,112px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sx-hud .k{display:inline-flex;gap:8px;align-items:center;margin-top:8px}
.sx-hud .lg{display:flex;gap:14px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.sx-hud.off{opacity:0}
.sx-scene{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.sx-scene.on{opacity:1;pointer-events:auto}
.sx-ph{background:var(--paper)}
.sx-ph .kb{position:absolute;inset:0;will-change:transform;transform-origin:50% 45%}
.sx-ph .plate{position:absolute;inset:0;border-radius:0;height:100%}
.sx-ph .plate figcaption{left:auto;right:0;bottom:0;max-width:min(420px,70%);text-align:right;background:none;padding:0 max(24px,env(safe-area-inset-right,0px)) 22px 0}
.sx-ph .plate .drop{top:13%;right:9%}
.sx-ph .shade{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 0%,color-mix(in srgb,var(--bg) 70%,transparent) 26%,transparent 58%);pointer-events:none}
.ann{position:absolute;transform:translate(-50%,-50%);pointer-events:none}
.ann svg{width:100%;height:100%;overflow:visible;display:block}
.ann circle{fill:none;stroke:var(--accent);stroke-width:2.2;vector-effect:non-scaling-stroke}
.ann .lb{position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:14px;white-space:nowrap;font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:999px;opacity:0;transition:opacity .4s}
.sx-ch{background:var(--bg);display:grid;place-items:center;text-align:center;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.sx-ch .in{display:grid;gap:14px;justify-items:center}
.sx-ch .big{font-family:var(--serif);font-size:clamp(96px,17vw,240px);line-height:.85;letter-spacing:-.03em;will-change:transform}
.sx-ch .big.word{font-size:clamp(64px,11vw,160px);font-style:italic}
.sx-ch .ti{font-family:var(--serif);font-size:clamp(24px,2.6vw,34px);will-change:transform;max-width:30ch;text-wrap:balance}
.sx-doc{background:var(--bg);display:grid;align-items:center;justify-items:end;padding:90px max(6vw,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px))}
.sx-doc .paper{width:min(600px,52vw);background:var(--paper);color:var(--ink);padding:44px 48px;border-radius:2px;box-shadow:var(--shadow);font-family:var(--serif);font-size:clamp(17px,1.5vw,21px);line-height:1.8;box-sizing:border-box;transform-origin:30% 40%;will-change:transform}
.sx-doc .dh{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:color-mix(in srgb,var(--ink) 65%,transparent);border-bottom:1px solid color-mix(in srgb,var(--ink) 20%,transparent);padding-bottom:12px;margin-bottom:18px}
.sx-doc mark{background:linear-gradient(var(--mark),var(--mark)) no-repeat 0 0/0% 100%;color:inherit}
.sx-doc .notes{display:grid;gap:10px;margin-top:24px}
.sx-doc .note{display:flex;gap:10px;align-items:flex-start;font-family:var(--sans);font-size:13.5px;line-height:1.45;opacity:0}
.sx-doc .note .n{font-family:var(--mono);font-size:11px;border:1px solid var(--accent);color:var(--accent);border-radius:50%;width:20px;height:20px;display:grid;place-items:center;flex:none}
.sx-gap{background:color-mix(in srgb,var(--bg) 90%,transparent);display:grid;align-items:center;justify-items:end;padding:90px max(6vw,env(safe-area-inset-right,0px)) 40px max(24px,env(safe-area-inset-left,0px));overflow:auto}
.sx-gap .in{width:min(560px,50vw);display:grid;gap:18px}
.sx-gap .yrs{font-family:var(--serif);font-size:clamp(96px,12vw,170px);line-height:.85;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.sx-gap svg.line{width:100%;height:56px;overflow:visible}
.sx-gap svg.line text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.sx-gap .hyp{opacity:0}
.sx-steps{position:relative;z-index:1}
.sx-step{display:flow-root;position:relative;box-sizing:border-box;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 max(6vw,env(safe-area-inset-left,0px));pointer-events:none}
.sx-card{pointer-events:auto;position:relative;width:min(400px,100%);box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);padding:22px 24px;margin-top:62vh}
.sx-card .k{display:flex;gap:8px;align-items:center}

/* ============ gaps are computed, not curated ============ */
// A gap is any span longer than 15 years without a measurement, any change over 20% between two points, or a change in what the census counted.
function detectGaps(L){
  const out=[];const s=L.series[0].pts;
  for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i];const ch=(b.v-a.v)/a.v;
    const why=[];if(b.y-a.y>15)why.push('silence');if(Math.abs(ch)>.2)why.push(ch<0?'drop':'rise');if(b.brk)why.push('break');if(i>1){const pc=(a.v-s[i-2].v)/s[i-2].v;if(Math.sign(pc)!==Math.sign(ch)&&Math.abs(ch)>.1&&Math.abs(pc)>.1)why.push('reversal')}
    if(why.length){const id=a.y+'-'+b.y;out.push({id,lang:L.id,from:a.y,to:b.y,ch,why,a,b,cur:L.gaps[id]||{q:'',hyps:[]}})}}
  if(L.gaps.daily){const d=L.series[1].pts;out.push({id:'daily',lang:L.id,from:d[0].y,to:d[d.length-1].y,why:['divergence'],ch:0,cur:L.gaps.daily})}
  return out;
}
for(const L of Object.values(LANGS)){L.gapList=detectGaps(L)}
function gapTitle(g){const L=LANGS[g.lang];
  if(g.why[0]==='divergence')return 'Most people who can speak '+L.name+' don’t use it daily';
  const pct=Math.round(Math.abs(g.ch)*100);
  if(g.why.includes('silence'))return (g.to-g.from)+' years with no count of speakers';
  if(g.why.includes('break')&&!g.why.includes('drop')&&!g.why.includes('rise'))return 'The census changed what it counted';
  return 'Speakers '+(g.ch<0?'fell':'rose')+' '+pct+'% between '+g.from+' and '+g.to;
}

  if(S.mode!=='region'){const mx=Math.max(...bins);const bw=(w-24)/bins.length;
    bins.forEach((b,i)=>{if(!b)return;const hgt=4+b/mx*34;s+=`<rect x="${x(Y0+i*5)+1}" y="${base-6-hgt}" width="${Math.max(1,bw-2)}" height="${hgt}" rx="1" fill="${C.ext}" opacity="${S.year>=Y0+i*5?.75:.25}"/>`});
    $('#trackLabel').textContent='Languages last recorded, per five years · Glottolog'}
  else{const L=LANGS[S.lang];$('#trackLabel').textContent=`${L.name}: diamonds are events, dots are counts, hatched spans are gaps`;
    for(const g of L.gapList){if(g.id==='daily')continue;s+=`<g class="mk" data-gap="${g.id}" style="cursor:pointer"><rect x="${x(g.from)+5}" y="${base-7}" width="${Math.max(4,x(g.to)-x(g.from)-10)}" height="14" rx="3" fill="url(#hatch)"/><rect x="${x(g.from)+5}" y="${base-7}" width="${Math.max(4,x(g.to)-x(g.from)-10)}" height="14" rx="3" fill="transparent"/></g>`}
    const pts=L.series[0].pts;for(const p of pts){s+=`<circle class="mk" data-pt="${p.y}" cx="${x(p.y)}" cy="${base}" r="4.5" fill="${p.k==='meas'?C.fg:C.bg}" stroke="${C.fg}" stroke-width="1.4" style="cursor:pointer"/>`}
    for(const ev of L.events){const ex=x(ev.y);s+=`<rect class="mk" data-ev="${ev.y}" x="${ex-5}" y="${base-38}" width="10" height="10" transform="rotate(45 ${ex} ${base-33})" fill="${C.surface}" stroke="${C.fg}" stroke-width="1.3" style="cursor:pointer"/>`}}
  const hx=x(S.year);s+=`<line x1="${hx}" x2="${hx}" y1="${base-46}" y2="${base}" stroke="${C.fg}" stroke-width="1.2"/><circle cx="${hx}" cy="${base}" r="8" fill="${C.surface}" stroke="${C.fg}" stroke-width="1.4"/><circle cx="${hx}" cy="${base}" r="3.5" fill="${C.accent}"/>`;
  track.setAttribute('viewBox',`0 0 ${w} 92`);track.innerHTML=s;track.setAttribute('aria-valuenow',S.year)}

function chartSVG(L,opts){const w=opts.w||380,h=opts.h||170,ml=44,mr=opts.mr??92,mt=10,mb=24;const all=L.series.flatMap(s=>s.pts.map(p=>p.v));
  const lo=Math.pow(10,Math.floor(Math.log10(Math.min(...all)*.8))),hi=Math.pow(10,Math.ceil(Math.log10(Math.max(...all)*1.1)));
  const X=y=>ml+(y-Y0)/(Y1-Y0)*(w-ml-mr),Yv=v=>mt+(1-(Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo)))*(h-mt-mb);
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Speakers of ${L.name} over time, log scale">`;
  for(let v=lo;v<=hi;v*=10){s+=`<line x1="${ml}" x2="${w-mr}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="${C.line}"/><text x="${ml-6}" y="${Yv(v)+3.5}" text-anchor="end">${v>=1e6?v/1e6+'M':v>=1e3?v/1e3+'k':v}</text>`}
  for(const yy of[1850,1900,1950,2000])s+=`<text x="${X(yy)}" y="${h-6}" text-anchor="middle">${yy}</text>`;
  const up=opts.upTo||Y1;const col=C[L.color.slice(2)];const gapIds=new Set(L.gapList.map(g=>g.id));
  s+=`<defs><clipPath id="clip${opts.id}"><rect x="0" y="0" width="${X(up)+6}" height="${h}" class="reveal"/></clipPath></defs><g clip-path="url(#clip${opts.id})">`;
  L.series.forEach((se,si)=>{const p=se.pts;const c=si===0?col:C.fg;
    for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];const dashed=a.k!=='meas'||b.k!=='meas'||(gapIds.has(a.y+'-'+b.y)&&(b.y-a.y>15||b.brk));
      s+=`<line x1="${X(a.y)}" y1="${Yv(a.v)}" x2="${X(b.y)}" y2="${Yv(b.v)}" stroke="${c}" stroke-width="1.6" ${dashed?'stroke-dasharray="2 4" stroke-linecap="round"':''}/>`}
    for(const q of p)s+=`<circle cx="${X(q.y)}" cy="${Yv(q.v)}" r="3.2" fill="${q.k==='meas'?c:C.surface}" stroke="${c}" stroke-width="1.4"/>`;
    const last=p[p.length-1];s+=`<text x="${X(last.y)+8}" y="${Yv(last.v)+3.5}" style="fill:${c}">${si===0?(L.id==='ga'?'can speak':'speakers'):'daily'}</text>`});
  s+='</g>';if(opts.yearLine)s+=`<line class="yl" x1="${X(S.year)}" x2="${X(S.year)}" y1="${mt}" y2="${h-mb}" stroke="${C.accent}" stroke-width="1"/>`;
  return s+'</svg>'}

async function askAI(g,btn){const L=LANGS[g.lang];btn.disabled=true;btn.textContent='Looking through published history…';
  const pts=L.series[0].pts.map(p=>`${p.y}: ${p.v} (${p.k==='meas'?'measured':'estimate'}; ${p.src})`).join('\n');
  const known=allHyps(g).map(h=>'- '+h.t).join('\n')||'(none)';
  const prompt=`You help families fill gaps in the documented history of the ${L.name} language (${L.endo}).\nSpeaker counts:\n${pts}\nKnown events:\n${L.events.map(e=>e.y+': '+e.t).join('\n')}\nThe gap: ${gapTitle(g)} (${g.from}–${g.to}).\nAlready suggested:\n${known}\n\nSuggest up to 3 OTHER possible reasons for this change that historians have documented. Rules: name a real, checkable source for each (a book, law, census report or archive); if you are not sure a source exists, write "Needs a source" and use low confidence; never invent people, quotes or numbers; one plain sentence of under 35 words each.\nReturn JSON only: {"hypotheses":[{"t":"...","cat":"one or two words","c":"low|medium|high","s":"source"}]}`;
  try{const out=await store.sample.json(prompt,{modelTier:'default'});const hs=(out&&out.hypotheses||[]).slice(0,3);
    for(const h of hs){const doc={lang:g.lang,gap:g.id,t:String(h.t||'').slice(0,300),cat:String(h.cat||'').slice(0,40),c:['low','medium','high'].includes(h.c)?h.c:'low',s:String(h.s||'Needs a source').slice(0,200),by:'ai',at:Date.now()};
      if(store.db){try{await store.db.collection('aiHypotheses').add(doc)}catch(e){store.ai.push({...doc,id:'l'+Math.random().toString(36).slice(2)})}}else{store.ai.push({...doc,id:'l'+Math.random().toString(36).slice(2)});saveLocal()}}
    refreshCommunity();if(!hs.length)toast('No further reasons with a source were found.')}

const SX={el:null,lang:null,steps:[],tops:[],cv:null,ctx:null,W:0,H:0,i:-1,p:0,raf:0,ro:null};
const clamp01=v=>Math.max(0,Math.min(1,v));
const smooth=t=>{t=clamp01(t);return t*t*(3-2*t)};
function camAt(i,p){const st=SX.steps;let cur=null,prev=null;
  for(let j=i;j>=0;j--)if(st[j].t==='map'){cur=j;break}
  if(cur===null){for(let j=0;j<st.length;j++)if(st[j].t==='map'){return{...st[j].cam}}}
  for(let j=cur-1;j>=0;j--)if(st[j].t==='map'){prev=j;break}
  const b=st[cur].cam;if(prev===null||cur!==i)return{...b};const a=st[prev].cam;
  const t=reduce?(p>.12?1:0):smooth((p-.04)/.7),tp=reduce?t:smooth((p-.04)/.45);
  const dl=((b.lon-a.lon+540)%360)-180;
  return{lon:a.lon+dl*tp,lat:a.lat+(b.lat-a.lat)*tp,z:Math.exp(Math.log(a.z)+(Math.log(b.z)-Math.log(a.z))*t),year:a.year+(b.year-a.year)*t,path:(a.path||0)+((b.path||0)-(a.path||0))*t}}
function gcPoint(a,b,t){const v=o=>[Math.cos(o.lat*RAD)*Math.cos(o.lon*RAD),Math.cos(o.lat*RAD)*Math.sin(o.lon*RAD),Math.sin(o.lat*RAD)];
  const v1=v(a),v2=v(b);const d=Math.acos(Math.min(1,v1[0]*v2[0]+v1[1]*v2[1]+v1[2]*v2[2]));if(d<1e-6)return[a.lon,a.lat];
  const A=Math.sin((1-t)*d)/Math.sin(d),B=Math.sin(t*d)/Math.sin(d);const w=v1.map((x,k)=>A*x+B*v2[k]);return[Math.atan2(w[1],w[0])/RAD,Math.atan2(w[2],Math.hypot(w[0],w[1]))/RAD]}
// One renderer for the globe, the region view and story mode, all in the same orthographic projection, so zooming never swaps maps.
function drawMapCore(c,W,H,o){const L=o.lang?LANGS[o.lang]:null,R=o.R,cx=o.cx,cy=o.cy,z=o.z,s0=Math.sin(o.lat*RAD),c0=Math.cos(o.lat*RAD);
  const P=(lon,lat)=>{const l=(lon-o.lon)*RAD,p=lat*RAD,cp=Math.cos(p),sp=Math.sin(p),cl=Math.cos(l);return[cx+R*cp*Math.sin(l),cy-R*(c0*sp-s0*cp*cl),s0*sp+c0*cp*cl]};
  const on=(x,y)=>x>-20&&x<W+20&&y>-20&&y<H+20;
  c.clearRect(0,0,W,H);const worldA=clamp01((5.5-z)/3),regA=L?clamp01((z-3)/3.5):0,year=Math.round(o.year);
  if(z<3){c.globalAlpha=1-clamp01((z-1.6)/1.4);c.beginPath();c.arc(cx,cy,R,0,6.283);c.strokeStyle=C.line;c.lineWidth=1;c.stroke()}
  const ds=Math.min(2.4,Math.max(1.15,R/190));
  if(worldA>0){const w=GRIDS.world;c.fillStyle=C.land;
    for(let k=0;k<w.length;k+=2){const q=P(w[k],w[k+1]);if(q[2]<=0||!on(q[0],q[1]))continue;c.globalAlpha=worldA*(.25+.75*q[2]);c.beginPath();c.arc(q[0],q[1],ds*(.55+.45*q[2]),0,6.283);c.fill()}
    for(let i=0;i<CRIT.length;i++){const d=CRIT[i];const q=P(d[2],d[1]);if(q[2]<=.02||!on(q[0],q[1]))continue;c.globalAlpha=worldA*o.critA*(.35+.65*q[2]);c.beginPath();c.arc(q[0],q[1],ds*o.critR,0,6.283);
      if(d[3]===4){if(!d[5]||year>=d[5]){c.strokeStyle=C.ext;c.lineWidth=1;c.stroke()}else{c.fillStyle=C.ext;c.fill()}}else{c.fillStyle=d[3]===2?C.mori:C.near;c.fill()}
      if(o.hits&&worldA>.6)o.hits.push([q[0],q[1],i])}}
  if(o.markers){const t=performance.now()/1000;for(const M of Object.values(LANGS)){const q=P(M.lon,M.lat);const a=(1-regA)*q[2];if(q[2]<=0||a<=0)continue;const mc=C[M.color.slice(2)];
    c.globalAlpha=a;c.beginPath();c.arc(q[0],q[1],ds*5+(reduce?0:Math.sin(t*2)*2),0,6.283);c.fillStyle=rgba(mc,.16);c.fill();c.beginPath();c.arc(q[0],q[1],ds*2.4,0,6.283);c.fillStyle=mc;c.fill();
    if(o.hits&&regA===0)o.hits.push([q[0],q[1],M.id])}}
  if(!L){c.globalAlpha=1;return}
  const col=C[L.color.slice(2)];
  if(regA>0){const M=regionModel(L,year),step=L.id==='ga'?.1:.03,rd=Math.max(1.1,R*step*RAD*.36);
    for(const p of REG[L.id].pts){const q=P(p.lon,p.lat);if(q[2]<=0||!on(q[0],q[1]))continue;c.beginPath();c.arc(q[0],q[1],rd,0,6.283);paintRegionDot(c,p,M,col,regA,rd)}
    if(L.id==='haw'&&year>=1940){const q=P(-160.15,21.9),a=regA*clamp01((year-1940)/25),rr=Math.max(26,R*.004);c.globalAlpha=a;c.beginPath();c.arc(q[0],q[1],rr,0,6.283);c.strokeStyle=col;c.lineWidth=1.4;c.setLineDash([3,4]);c.stroke();c.setLineDash([]);
      c.font='italic 15px Spectral,Georgia,serif';c.fillStyle=C.fg;c.fillText('Niʻihau',q[0]-rr-8-c.measureText('Niʻihau').width,q[1]-4);c.font='11px "IBM Plex Mono",monospace';c.fillStyle=C.muted;const t='Hawaiian still spoken at home';c.fillText(t,q[0]-rr-8-c.measureText(t).width,q[1]+12)}
    c.globalAlpha=regA*clamp01((z-8)/4);c.font='11px "IBM Plex Mono",monospace';c.fillStyle=C.muted;
    for(const [lo,la,t] of L.labels){const q=P(lo,la);if(q[2]>0&&on(q[0],q[1]))c.fillText(t.toUpperCase()===t?t.split('').join(' '):t,q[0],q[1])}}
  else if(!o.markers){const q=P(L.lon,L.lat);if(q[2]>0){c.globalAlpha=1;c.beginPath();c.arc(q[0],q[1],9,0,6.283);c.fillStyle=rgba(col,.18);c.fill();c.beginPath();c.arc(q[0],q[1],4,0,6.283);c.fillStyle=col;c.fill()}}
  const rt=ROUTES[L.id];if(rt&&o.path>0){c.lineWidth=1.6;
    rt.to.forEach((dst,k)=>{const prog=clamp01(o.path*1.5-k*.12);if(prog<=0)return;const n=Math.max(2,Math.round(48*prog));let last=null;
      c.globalAlpha=.9;c.strokeStyle=col;c.setLineDash([2,5]);c.lineCap='round';c.beginPath();
      for(let s=0;s<=n;s++){const [lo,la]=gcPoint(rt.from,dst,prog*s/n);const q=P(lo,la);if(q[2]<=0){last=null;continue}if(last)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1]);last=q}c.stroke();c.setLineDash([]);
      if(last&&prog<1){c.beginPath();c.arc(last[0],last[1],3.5,0,6.283);c.fillStyle=col;c.fill()}
      if(prog>=1){const q=P(dst.lon,dst.lat);if(q[2]>0&&on(q[0],q[1])){c.globalAlpha=1;for(let m=0;m<7;m++){const a=m*2.4,r=4+m*1.6;c.beginPath();c.arc(q[0]+Math.cos(a)*r,q[1]+Math.sin(a)*r,1.8,0,6.283);c.fillStyle=col;c.fill()}
        c.font='12px "IBM Plex Mono",monospace';c.fillStyle=C.fg;c.fillText(dst.n,q[0]+14,q[1]+4+(dst.dy||0))}}});
    const f=P(rt.from.lon,rt.from.lat);if(f[2]>0&&z<6){c.globalAlpha=1;c.font='12px "IBM Plex Mono",monospace';c.fillStyle=C.muted;c.fillText(rt.from.n,f[0]+8,f[1]-8)}}
  c.globalAlpha=1}
function drawStoryMap(cam){const W=SX.W,H=SX.H;if(!W)return;const L=LANGS[SX.lang];const narrow=W<820;
  drawMapCore(SX.ctx,W,H,{lon:cam.lon,lat:cam.lat,z:cam.z,R:Math.min(W,H)*.42*cam.z,cx:narrow?W/2:W*.6,cy:narrow?H*.4:H*.5,year:cam.year,lang:SX.lang,path:cam.path||0,critA:.32,critR:1.05,markers:false});
  const year=Math.round(cam.year),hud=SX.el.querySelector('.sx-hud'),v=seriesAt(L,'can',year);hud.querySelector('.y').textContent=year;
  hud.querySelector('.k').innerHTML=v.kind==='meas'?'<i class="dot" style="color:var(--fg)"></i>Measured':v.kind==='before'?'<i class="ring" style="color:var(--muted);border-style:dashed"></i>Before the first count':`<i class="dot" style="color:var(--fg);opacity:.4"></i>Estimated · ${fmt(v.v)} speakers`}
function regionModel(L,y){const R=REG[L.id];const can=seriesAt(L,'can',y),daily=seriesAt(L,'daily',y);
  const usesDaily=!!daily;const solidShare=usesDaily?daily.share:can.share,paleShare=usesDaily?can.share:0;
  const measured=(usesDaily?daily.kind:can.kind)==='meas';const afterPartition=L.id==='ga'&&y>=1922;const base=afterPartition?R.inN:R.homeN;
  const order=R.pts.filter(p=>p.home&&!(afterPartition&&p.out)).sort((a,b)=>a.rank-b.rank);const rk=new Map();order.forEach((p,i)=>rk.set(p,i));
  return{nSolid:Math.round(solidShare*base),nPale:Math.round(paleShare*base),measured,afterPartition,rk}}
function paintRegionDot(c,p,M,col,alpha,ds){
  if(!p.home){c.globalAlpha=alpha*.55;c.fillStyle=C.land;c.fill();return}
  if(M.afterPartition&&p.out){c.globalAlpha=alpha*.8;c.strokeStyle=C.land;c.lineWidth=1;c.stroke();return}
  const i=M.rk.get(p);
  if(i<M.nSolid){c.globalAlpha=alpha*(M.measured?1:.55);c.fillStyle=col;c.fill()}
  else if(i<M.nSolid+M.nPale){c.globalAlpha=alpha*(M.measured?.9:.6);c.strokeStyle=col;c.lineWidth=Math.max(1,ds*.4);c.stroke()}
  else{c.globalAlpha=alpha;c.fillStyle=C.faint;c.fill()}}

function sceneHTML(L,s,i){
  if(s.t==='photo')return`<div class="sx-scene sx-ph" data-sc="${i}"><div class="kb">${plateHTML(s.key,s.cap,s.scene)}${s.ann?`<div class="ann" style="left:${s.ann.x*100}%;top:${s.ann.y*100}%;width:${s.ann.r*200}vmin;height:${s.ann.r*200}vmin"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg><span class="lb">${esc(s.ann.l)}</span></div>`:''}</div>${s.hero?'<div class="shade"></div>':''}</div>`;
  if(s.t==='chapter')return`<div class="sx-scene sx-ch" data-sc="${i}"><div class="in"><div class="big ${s.word?'word':''}">${esc(s.big)}</div><div class="ti">${esc(s.ti)}</div></div></div>`;
  if(s.t==='doc')return`<div class="sx-scene sx-doc" data-sc="${i}"><div class="paper"><div class="dh">${esc(s.head)}</div><div>${s.html}</div><div class="notes">${s.notes.map((n,j)=>`<div class="note"><span class="n">${j+1}</span><span>${esc(n)}</span></div>`).join('')}</div></div></div>`;
  if(s.t==='gap'){const g=L.gapList.find(x=>x.id===s.gap);if(!g)return'';const W2=560;
    return`<div class="sx-scene sx-gap" data-sc="${i}"><div class="in"><div><div class="yrs" data-n="${g.to-g.from}">${g.to-g.from}</div><div class="cap" style="margin-top:10px">${esc(gapTitle(g))}</div></div>
     <svg class="line" viewBox="0 0 ${W2} 56"><line x1="14" x2="${W2-14}" y1="22" y2="22" stroke="${C.faint}" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" pathLength="100"/><circle cx="14" cy="22" r="6" fill="${g.a.k==='meas'?C.fg:C.bg}" stroke="${C.fg}" stroke-width="1.5"/><circle cx="${W2-14}" cy="22" r="6" fill="${g.b.k==='meas'?C.fg:C.bg}" stroke="${C.fg}" stroke-width="1.5"/><text x="14" y="50">${g.from} · ${fmt(g.a.v)}</text><text x="${W2-14}" y="50" text-anchor="end">${g.to} · ${fmt(g.b.v)}</text></svg>
     <div data-gapvis="${g.id}" data-lang="${L.id}">${gapHyps(g,true)}</div><div><button class="btn ghost sm" data-opengap="${g.id}">Confirm, correct or add to these</button></div></div></div>`}
  return''}
function cardHTML(L,ST,s){
  if(s.hero)return`<div class="sx-card hero"><div class="cap">${esc(L.place)} · ${esc(L.endo)}</div><h1>${esc(ST.title)}</h1><p>${esc(ST.dek)}</p><div class="mono" style="margin-top:20px">Scroll ↓</div></div>`;
  if(!s.h)return'';const mark=/unexplained|estimate/.test(s.k)?'<i class="ring" style="border-style:dashed"></i>':/measured/.test(s.k)?'<i class="dot" style="color:var(--fg)"></i>':'<i class="dot" style="color:var(--accent)"></i>';
  return`<div class="sx-card"><div class="k cap">${mark}${esc(s.k)}</div><h3>${esc(s.h)}</h3>${s.p.map(t=>`<p>${esc(t)}</p>`).join('')}</div>`}
function openStory(id){const L=LANGS[id],ST=STORIES[id];const el=$('#story');togglePlay(false);SX.el=el;SX.lang=id;SX.steps=ST.steps;SX.i=-1;
  const other=id==='ga'?'haw':'ga';
  el.innerHTML=`<div class="bar"><div class="brand"><b><span class="dot"></span>Mother Tongues</b><span class="crumb">${esc(L.name)} · the story</span></div><button class="btn ghost sm" id="sClose">Back to the map</button><div class="prog"></div></div>
   <div class="sx-stage"><canvas class="sx-map" aria-hidden="true"></canvas>
    <div class="sx-hud off"><div class="y"></div><div class="k mono"></div><div class="lg mono"><span><i class="dot" style="color:var(${L.color})"></i>${id==='ga'?'speaks Irish':'speaks Hawaiian'}</span>${id==='ga'?`<span><i class="ring" style="color:var(${L.color})"></i>can speak, not daily</span>`:''}<span><i class="dot" style="color:var(--faint)"></i>English</span></div></div>
    ${ST.steps.map((s,i)=>sceneHTML(L,s,i)).join('')}</div>
   <div class="sx-steps">${ST.steps.map((s,i)=>`<section class="sx-step" data-i="${i}" style="height:${s.h0||(s.t==='chapter'?130:s.hero?170:160)}vh">${cardHTML(L,ST,s)}</section>`).join('')}</div>
   <section class="end"><div class="in"><div class="cap">What the census never asked</div><h2>Who spoke ${esc(L.name)} at home, who stopped, and why.</h2><p>Records count people. Families remember the rest: the grandmother who switched to English for her children’s sake, the song only one aunt still knew. Add what you know to the gaps on the timeline.</p>
    <div class="row"><button class="btn" id="sAdd"><span class="dot"></span>Add your story</button><button class="btn ghost" id="sOther">Read the ${esc(LANGS[other].name)} story</button><button class="btn ghost" id="sBack">Back to the map</button></div></div></section>`;
  el.hidden=false;el.classList.remove('fade');el.scrollTop=0;initPlates(el);document.body.style.overflow='hidden';
  el.querySelector('#sClose').onclick=closeStory;el.querySelector('#sBack').onclick=closeStory;el.querySelector('#sAdd').onclick=()=>openForm({lang:id});el.querySelector('#sOther').onclick=()=>openStory(other);
  el.querySelectorAll('[data-opengap]').forEach(b=>b.onclick=()=>openGap(L.gapList.find(g=>g.id===b.dataset.opengap)));
  SX.cv=el.querySelector('.sx-map');SX.ctx=SX.cv.getContext('2d');
  SX.ro&&SX.ro.disconnect();SX.ro=new ResizeObserver(()=>{storyMeasure();storyTick()});SX.ro.observe(el.querySelector('.sx-stage'));
  el.onscroll=()=>{if(!SX.raf)SX.raf=requestAnimationFrame(()=>{SX.raf=0;storyTick()})};storyMeasure();storyTick()}
function storyMeasure(){const el=SX.el;if(!el||el.hidden)return;const r=SX.cv.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);SX.W=r.width;SX.H=r.height;
  SX.cv.width=r.width*dpr;SX.cv.height=r.height*dpr;SX.ctx.setTransform(dpr,0,0,dpr,0,0);
  const base=el.getBoundingClientRect().top-el.scrollTop;SX.tops=[...el.querySelectorAll('.sx-step')].map(s=>{const b=s.getBoundingClientRect();return{top:b.top-base,h:b.height}})}
function storyTick(){const el=SX.el;if(!el||el.hidden||!SX.tops.length)return;const vh=el.clientHeight,y=el.scrollTop+vh*.5;
  let i=0;for(let k=0;k<SX.tops.length;k++)if(SX.tops[k].top<=y)i=k;const p=clamp01((y-SX.tops[i].top)/SX.tops[i].h);const s=SX.steps[i];
  if(i!==SX.i){SX.i=i;el.querySelectorAll('.sx-scene').forEach(n=>n.classList.toggle('on',+n.dataset.sc===i));el.querySelector('.sx-hud').classList.toggle('off',s.t!=='map')}
  el.querySelector('.prog').style.width=(el.scrollTop/Math.max(1,el.scrollHeight-vh)*100)+'%';
  const sc=el.querySelector(`.sx-scene[data-sc="${i}"]`);
  if(s.t==='map'||(sc&&s.t==='gap')||!sc)drawStoryMap(camAt(i,p));
  if(!sc)return;
  if(s.t==='photo'){const kb=sc.querySelector('.kb'),k=s.ken||[0,0];if(!reduce)kb.style.transform=`scale(${1.04+.16*p}) translate(${(p-.5)*k[0]}%,${(p-.5)*k[1]+(s.hero?p*6:0)}%)`;
    const a=sc.querySelector('.ann');if(a){const t=reduce?(p>.3?1:0):smooth((p-.3)/.18);a.querySelector('circle').setAttribute('stroke-dashoffset',100*(1-t));a.querySelector('.lb').style.opacity=t>=1?1:0}}
  if(s.t==='chapter'&&!reduce){sc.querySelector('.big').style.transform=`translateY(${(.5-p)*28}vh)`;sc.querySelector('.ti').style.transform=`translateY(${(.5-p)*10}vh)`}
  if(s.t==='doc'){const z=reduce?1:1+.22*smooth((p-.12)/.45);sc.querySelector('.paper').style.transform=`scale(${z})`;
    sc.querySelectorAll('mark').forEach((m,j)=>m.style.backgroundSize=`${(reduce?(p>.2?1:0):smooth((p-.2-j*.1)/.1))*100}% 100%`);
    sc.querySelectorAll('.note').forEach((n,j)=>{const t=reduce?(p>.3?1:0):smooth((p-.45-j*.08)/.08);n.style.opacity=t;n.style.transform=`translateX(${(1-t)*-10}px)`})}
  if(s.t==='gap'){const n=sc.querySelector('.yrs');const N=+n.dataset.n;n.textContent=reduce?N:Math.round(N*smooth(p/.3));
    sc.querySelector('svg.line line').setAttribute('stroke-dashoffset',0);
    sc.querySelectorAll('.hyp').forEach((h,j)=>{const t=reduce?1:smooth((p-.25-j*.09)/.08);h.style.opacity=t;h.style.transform=`translateY(${(1-t)*14}px)`})}}
function closeStory(){const el=$('#story');el.classList.add('fade');SX.ro&&SX.ro.disconnect();el.onscroll=null;setTimeout(()=>{el.hidden=true;el.innerHTML='';SX.el=null},600);document.body.style.overflow=''}

/* ============ boot ============ */
renderLegend();updateCounter();updateYearNote();resize();connect();
if(!reduce)setTimeout(()=>{if(S.mode==='globe'&&S.year===Y0&&!S.playing)togglePlay(true)},1200);
</script>
