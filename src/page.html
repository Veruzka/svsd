<meta charset="utf-8">
<title>Endangered Languages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="https://unpkg.com/topojson-server@3.0.1/dist/topojson-server.min.js"></script>
<style>
/* Layout: one full-height stage. The map is the page; a timeline docks below it, a reading panel docks right; stories open as a scrolling layer above. */
:root{
  --bg:#fbfbf9; --surface:#ffffff; --fg:#1d1e20; --muted:#6a6c70; --faint:#b9bbb7; --land:#dadbd9; --line:#e3e3de; --en:#8fb0de; --eng:#cdd0d2;
  --accent:#d6452b; --ga:#0f8a4c; --haw:#1a5ec9; --mori:#cf962a; --near:#d6452b; --ext:#8b8d90;
  --paper:#f2efe7; --ink:#2b2824; --mark:rgba(214,69,43,.16); --shadow:0 10px 30px rgba(20,20,25,.08),0 1px 2px rgba(20,20,25,.06);
  --serif:"Spectral",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131416; --surface:#1b1c1f; --fg:#ebeae6; --muted:#9b9ca0; --faint:#4a4c50; --land:#3a3c40; --line:#2a2c30; --en:#3e5b86; --eng:#46494d;
  --accent:#f0644a; --ga:#3fc485; --haw:#5a9cf0; --mori:#e2b14c; --near:#f0644a; --ext:#8c8e91;
  --paper:#24221f; --ink:#e8e2d6; --mark:rgba(240,100,74,.22); --shadow:0 10px 30px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1b1c1f; --fg:#ebeae6; --muted:#9b9ca0; --faint:#4a4c50; --land:#3a3c40; --line:#2a2c30; --en:#3e5b86; --eng:#46494d;
  --accent:#f0644a; --ga:#3fc485; --haw:#5a9cf0; --mori:#e2b14c; --near:#f0644a; --ext:#8c8e91;
  --paper:#24221f; --ink:#e8e2d6; --mark:rgba(240,100,74,.22); --shadow:0 10px 30px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em;color:var(--muted)}
.cap{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.ring{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor;flex:none}

/* ---------- app frame ---------- */
#app{position:relative;height:100%;display:grid;grid-template-columns:minmax(0,1fr) 0;grid-template-rows:minmax(0,1fr) auto;transition:grid-template-columns .7s cubic-bezier(.22,.61,.36,1)}
#app.region{grid-template-columns:minmax(0,1fr) min(440px,38vw)}
#stage{position:relative;grid-column:1;grid-row:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .6s ease}
#app.away #bg{opacity:0}
#map.dragging{cursor:grabbing}
header.top{position:absolute;top:0;left:0;right:0;display:flex;align-items:flex-start;gap:24px;justify-content:space-between;padding:22px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px));pointer-events:none;z-index:3}
header.top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand b{font-family:var(--serif);font-weight:400;font-size:22px;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand b .dot{color:var(--accent)}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted)}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font:inherit}
.crumb button:hover{color:var(--fg)}
.crumb span{color:var(--fg)}
/* world view: title, subtitle and status key in a left column; the header brand only shows inside a language */
#app:not(.away) #legend{display:none}
#side{position:absolute;top:34px;left:max(32px,env(safe-area-inset-left,0px));width:340px;z-index:3;display:grid;gap:16px;transition:opacity .4s}
#app.away #side{opacity:0;pointer-events:none}
#side h1{font-family:var(--serif);font-weight:400;font-size:52px;line-height:1;margin:0;letter-spacing:-.015em;text-wrap:balance}
#side .sub{margin:0;font-family:var(--serif);font-size:18px;line-height:1.5;color:color-mix(in srgb,var(--fg) 62%,var(--bg));max-width:30ch}
#side .key{position:fixed;top:40px;right:max(32px,env(safe-area-inset-right,0px));width:250px;display:grid;gap:12px}
.krow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:start}
.krow .dot,.krow .ring{margin-top:6px}
.krow b{display:block;font-weight:500;font-size:14px}
.krow small{display:block;font-size:12.5px;line-height:1.4;color:var(--muted)}
.krow .n{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;padding-top:2px}
#side .src a{color:var(--fg);text-underline-offset:3px}
#legend{position:absolute;left:max(24px,env(safe-area-inset-left,0px));top:78px;display:grid;gap:6px;z-index:2;font-family:var(--mono);font-size:12px;color:var(--fg)}
#legend .row{display:flex;align-items:center;gap:9px}
#legend hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:150px}
#legend .k{color:var(--muted)}

/* globe-mode search */
#find{position:absolute;left:50%;top:70%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));display:grid;gap:12px;justify-items:center;z-index:3;transition:opacity .4s}
#app.away #find{opacity:0;pointer-events:none}
.search{position:relative;width:100%}
.search input[type=text]{width:100%;box-sizing:border-box;height:56px;border-radius:28px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;font-size:17px;padding:0 20px 0 54px;box-shadow:var(--shadow)}
.search input[type=text]::placeholder{color:var(--muted)}
.search svg{position:absolute;left:22px;top:20px}
#results{position:absolute;bottom:64px;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);max-height:260px;overflow:auto;padding:6px}
#results button{display:flex;width:100%;justify-content:space-between;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:9px 12px;border-radius:10px}
#results button:hover,#results button.on{background:var(--bg)}
#results .mono{flex:none}
.starts{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.starts button{background:none;border:0;display:flex;align-items:center;gap:8px;color:var(--fg);font-size:15px;padding:4px 2px}
.starts button:hover span{text-decoration:underline;text-underline-offset:3px}
.hint{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:center}

/* tooltip & pinned card on map */
#tip{position:absolute;z-index:4;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;min-width:200px;max-width:280px;font-size:14px}
#tip.pinned{pointer-events:auto}
#tip h4{margin:0 0 2px;font-weight:500;font-size:15px}
#tip .row{display:flex;gap:8px;align-items:center;margin-top:6px}
#tip button{margin-top:10px;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
#tip button:hover{border-color:var(--fg)}

/* ---------- timeline ---------- */
#time{grid-column:1;grid-row:2;max-height:200px;transition:max-height .6s cubic-bezier(.22,.61,.36,1),padding .6s cubic-bezier(.22,.61,.36,1);display:grid;grid-template-columns:220px 46px minmax(0,1fr);align-items:end;gap:22px;padding:10px max(24px,env(safe-area-inset-right,0px)) 18px max(24px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--bg);position:relative;z-index:3}
.yearbox{min-width:0}
/* the timeline only exists inside a language; it slides open when the region lands */
#app:not(.timeon) #time{max-height:0;padding-top:0;padding-bottom:0;overflow:hidden;border-top-color:transparent}
#year{font-family:var(--serif);font-size:64px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
#yearNote{display:block;margin-top:6px;height:18px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#yearNote i{margin-right:7px;vertical-align:0}
#play{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;margin-bottom:14px}
#play:hover{border-color:var(--fg)}
.trackwrap{position:relative;min-width:0}
.trackhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:2px;height:18px;line-height:18px}
#trackLabel{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trackhead .keys{flex:none;white-space:nowrap}
#track{width:100%;height:92px;display:block;touch-action:none;cursor:pointer;overflow:visible}
#track text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
#track .mk{transform-box:fill-box;transform-origin:center;transition:transform .3s ease,stroke .3s ease}
#track .mk.on{stroke:var(--accent);stroke-width:2;transform:scale(1.45)}
#track rect.mk.on{transform:rotate(45deg) scale(1.45)}
/* fact card: follows the slider, sits over the active marker */
#pop{position:absolute;bottom:120px;transform:translateX(-50%);width:380px;max-width:calc(100vw - 40px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;z-index:6;box-sizing:border-box;opacity:0;pointer-events:none;transition:opacity .25s ease,left .35s cubic-bezier(.22,.61,.36,1)}
#pop.on{opacity:1;pointer-events:auto}
#pop .fc{transition:opacity .16s ease}
#pop.swap .fc{opacity:0}
/* while playing: a bar shows how long the timeline stays on this fact */
.fhold{display:flex;align-items:center;gap:12px;margin-top:12px}
.fbar{flex:1;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0);animation:fhold linear forwards}
@keyframes fhold{to{transform:scaleX(1)}}
#pop:hover .fbar i,#pop.frozen .fbar i{animation-play-state:paused}
.fnext{font-size:13px;white-space:nowrap}
#pop .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:4px}
#pop .x:hover{color:var(--fg)}
.fc{display:grid;gap:6px;padding-right:18px}
.fc.ev.img{grid-template-columns:118px minmax(0,1fr);gap:14px;align-items:start}
.fc h5{font-family:var(--serif);font-weight:400;font-size:20px;line-height:1.2;margin:2px 0 0;text-wrap:balance}
.fc p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.45}
.fc .src{font-size:11px;line-height:1.4}
.fthumb{aspect-ratio:4/3;margin:0;border-radius:6px;cursor:pointer}
#pop .fthumb .drop,#pop .fthumb figcaption{display:none}
.fc .big{font-family:var(--serif);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums}
.fc .big small{font-family:var(--sans);font-size:13px;color:var(--muted)}
.fc .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.delta{font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:999px;white-space:nowrap}
.delta.dn{background:color-mix(in srgb,var(--near) 15%,transparent);color:var(--near)}
.delta.up{background:color-mix(in srgb,var(--ga) 15%,transparent);color:var(--ga)}
.d20{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;margin:4px 0 2px}
.d20 i{aspect-ratio:1;border-radius:50%;background:var(--line)}

/* ---------- panel ---------- */
#panel{grid-column:2;grid-row:1/3;border-left:1px solid var(--line);background:var(--surface);overflow-x:hidden;overflow-y:auto;min-width:0;position:relative;z-index:4}
@media (min-width:821px){#panel .in,#panel .ctas{width:min(440px,38vw);box-sizing:border-box;margin-left:auto}}
#panel .in{padding:28px 30px 120px;display:grid;gap:22px}
#panel h2{font-family:var(--serif);font-weight:400;font-size:38px;line-height:1.05;margin:0;text-wrap:balance}
#panel .title{display:grid;gap:8px;padding-right:28px}
#panel .endo{margin:0;font-size:14px;color:var(--muted)}
#panel .endo span{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted)}
.close{position:absolute;right:18px;top:18px;background:none;border:0;font-size:22px;color:var(--muted);line-height:1}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line)}
.chip.warn{border-color:transparent;background:color-mix(in srgb,var(--mori) 18%,transparent);color:var(--fg)}
.chip.crit{border-color:transparent;background:color-mix(in srgb,var(--near) 15%,transparent)}
/* hover / focus explanation on panel chips */
.chips:has(.tipb){position:relative}
.chip[tabindex]{cursor:help}
.tipb{position:absolute;top:calc(100% + 8px);left:0;z-index:6;width:max-content;max-width:260px;display:grid;gap:4px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-family:var(--sans);font-size:12.5px;line-height:1.45;text-transform:none;letter-spacing:0;white-space:normal;opacity:0;transform:translateY(-4px);transition:opacity .18s,transform .18s;pointer-events:none}
.tipb b{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip[tabindex]:hover .tipb,.chip[tabindex]:focus-visible .tipb{opacity:1;transform:none}
.lede{font-family:var(--serif);font-size:18px;line-height:1.6;margin:0}
.now{display:grid;gap:4px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.now .big{font-family:var(--serif);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.now .big small{font-family:var(--sans);font-size:14px;color:var(--muted)}
.sec{display:grid;gap:12px}
.sec>.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}
.lost{display:grid;gap:0}
.lost .it{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:12px 0;border-top:1px solid var(--line);transition:opacity .6s,filter .6s}
.lost .it:last-child{border-bottom:1px solid var(--line)}
.lost .w{font-family:var(--serif);font-size:20px;line-height:1.2}
.lost .k{grid-row:1/3;padding-top:5px;width:74px}
.lost .m{font-size:14px;color:var(--muted)}
.gaps{display:grid;gap:8px}
.gapbtn{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--bg);border:1px dashed var(--faint);border-radius:12px;padding:12px 14px}
.gapbtn:hover{border-color:var(--fg)}
.gapbtn b{font-weight:500;font-size:14px;display:block}
.gapbtn .mono{display:block;margin-top:2px}
.state{font-family:var(--mono);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.st-un .ring{border-style:dashed;color:var(--muted)}
.st-ai .ring{color:var(--mori)}
.st-ok .dot{color:var(--ga)}
.stories{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.story{display:grid;gap:6px;min-width:0}
.story .thumb{aspect-ratio:4/3;border-radius:10px;background:var(--bg);border:1px solid var(--line);overflow:hidden;position:relative;display:grid;place-items:center}
.story .thumb img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05)}
.story .thumb audio{width:92%}
.story .thumb .q{font-family:var(--serif);font-size:15px;line-height:1.35;padding:14px;color:var(--fg)}
.story b{font-weight:500;font-size:14px;line-height:1.3}
.story .ex{position:absolute;left:8px;top:8px}
.empty{border:1px dashed var(--faint);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
.ctas{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 30px calc(18px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--surface) 70%,transparent)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:10px;height:52px;border-radius:26px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);font-weight:500;font-size:15px;padding:0 20px}
.btn .dot{color:var(--accent)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--fg)}
.btn.sm{height:38px;font-size:14px;padding:0 14px}
.linkish{background:none;border:0;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;font-size:14px}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;transition:opacity .6s ease}
.layer.fade{opacity:0;pointer-events:none}

/* intro */
/* language intro: covers the map stage after the zoom, then fades back into it */
/* fades in over the end of the zoom */
.lintro{position:absolute;inset:0;z-index:5;display:grid;place-items:center;overflow:auto;padding:84px max(24px,env(safe-area-inset-right,0px)) 32px max(24px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(3px);opacity:0;transition:opacity 1.3s cubic-bezier(.22,.61,.36,1),transform .9s ease,filter .9s ease}
.lintro.on{opacity:1}
.lintro.out{opacity:0;transform:scale(.97);filter:blur(6px);pointer-events:none}
.lbar{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--accent)}
.vnote{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:26px 0 8px}
.vplay{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.vplay:hover{border-color:var(--fg)}
.vwave{width:100%;height:56px;display:block}
.vtime{font-variant-numeric:tabular-nums;white-space:nowrap}
.intro{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:center}
.intro .plate{aspect-ratio:4/5}
.intro blockquote{margin:0;font-family:var(--serif);font-size:clamp(28px,3.6vw,44px);line-height:1.15;text-wrap:balance}
.intro blockquote i{display:block;color:var(--muted);font-size:.62em;line-height:1.35;margin-top:14px;font-style:italic}
.intro .attr{margin-top:12px}
.intro .stat{font-size:16px;margin:22px 0 0;max-width:46ch}
.intro .stat b{font-family:var(--serif);font-weight:500;font-size:20px}
.intro .go{display:flex;gap:16px;align-items:center;margin-top:28px;flex-wrap:wrap}

/* halftone plate */
.plate{position:relative;border-radius:4px;overflow:hidden;background:var(--paper);width:100%;max-width:100%}
.plate canvas{position:absolute;inset:0;width:100%;height:100%}
.plate figcaption{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(to top,color-mix(in srgb,var(--paper) 92%,transparent),transparent);display:grid;gap:2px}
.plate figcaption .t{font-size:13px;color:var(--ink)}
.plate .drop{position:absolute;right:10px;top:10px;font-family:var(--mono);font-size:11px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.plate .drop:hover{color:var(--fg);border-color:var(--fg)}
.plate.over{outline:2px dashed var(--accent);outline-offset:-6px}

/* story: one sticky stage under the whole scroll; steps scroll over it */

/* ============ gaps are computed, not curated ============ */
// A gap is any span longer than 15 years without a measurement, any change over 20% between two points, or a change in what the census counted.
function detectGaps(L){
  const out=[];const s=L.series[0].pts;
  for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i];const ch=(b.v-a.v)/a.v;
    const why=[];if(b.y-a.y>15)why.push('silence');if(Math.abs(ch)>.2)why.push(ch<0?'drop':'rise');if(b.brk)why.push('break');if(i>1){const pc=(a.v-s[i-2].v)/s[i-2].v;if(Math.sign(pc)!==Math.sign(ch)&&Math.abs(ch)>.1&&Math.abs(pc)>.1)why.push('reversal')}
    if(why.length){const id=a.y+'-'+b.y;out.push({id,lang:L.id,from:a.y,to:b.y,ch,why,a,b,cur:L.gaps[id]||{q:'',hyps:[]}})}}
  if(L.gaps.daily){const d=L.series[1].pts;out.push({id:'daily',lang:L.id,from:d[0].y,to:d[d.length-1].y,why:['divergence'],ch:0,cur:L.gaps.daily})}
  return out;
}
for(const L of Object.values(LANGS)){L.gapList=detectGaps(L)}
function gapTitle(g){const L=LANGS[g.lang];
  if(g.why[0]==='divergence')return 'Most people who can speak '+L.name+' don’t use it daily';
  const pct=Math.round(Math.abs(g.ch)*100);
  if(g.why.includes('silence'))return (g.to-g.from)+' years with no count of speakers';
  if(g.why.includes('break')&&!g.why.includes('drop')&&!g.why.includes('rise'))return 'The census changed what it counted';
  return 'Speakers '+(g.ch<0?'fell':'rose')+' '+pct+'% between '+g.from+' and '+g.to;
}

/* ============ community data (db, with a local fallback) ============ */
const store={db:null,me:null,assets:null,sample:null,stories:[],votes:[],ai:[],local:false};
function loadLocal(){try{const j=JSON.parse(localStorage.getItem('mt-local')||'{}');store.stories=j.stories||[];store.votes=j.votes||[];store.ai=j.ai||[]}catch(e){}}
function saveLocal(){try{localStorage.setItem('mt-local',JSON.stringify({stories:store.stories,votes:store.votes,ai:store.ai}))}catch(e){}}
async function connect(){
  const c=window.claude;if(!c||!c.use){store.local=true;loadLocal();refreshCommunity();return}
  c.use('sample').then(s=>{store.sample=s;refreshCommunity()}).catch(()=>{});
  c.use('assets').then(a=>{store.assets=a}).catch(()=>{});
  let db=null;try{db=await c.use('db')}catch(e){}
  if(!db){store.local=true;loadLocal();refreshCommunity();return}
  store.db=db;
  try{const u=await c.use('user');store.me=u?await u.id():null}catch(e){}
  const sub=(name,key)=>db.collection(name).onSnapshot(snap=>{store[key]=snap.docs.map(d=>({id:d.id,...d.data()}));refreshCommunity()},()=>{});
  sub('stories','stories');sub('votes','votes');sub('aiHypotheses','ai');
}
function allHyps(g){const base=(g.cur.hyps||[]).map((h,i)=>({...h,id:g.lang+':'+g.id+':'+i,fresh:false}));
  const extra=store.ai.filter(a=>a.lang===g.lang&&a.gap===g.id).map(a=>({t:a.t,c:a.c,cat:a.cat,s:a.s,id:'ai:'+a.id,fresh:true}));return base.concat(extra)}
function votesFor(id){const v=store.votes.filter(x=>x.hyp===id);return{yes:v.filter(x=>x.v==='confirm').length,no:v.filter(x=>x.v==='reject').length,mine:(v.find(x=>x.by===(store.me||'local'))||{}).v}}
function gapState(g){const hs=allHyps(g);const st=store.stories.filter(s=>s.lang===g.lang&&s.gap===g.id).length;
  const yes=hs.reduce((n,h)=>n+votesFor(h.id).yes,0);
  if(st>0&&yes>0)return{k:'ok',l:'Confirmed by the community'};
  if(hs.length)return{k:'ai',l:'AI-suggested · unverified'};
  return{k:'un',l:'Unexplained'}}
function stateHTML(s){return `<span class="state st-${s.k}">${s.k==='ok'?'<i class="dot"></i>':'<i class="ring"></i>'}${esc(s.l)}</span>`}
async function vote(h,g,v){const by=store.me||'local';const id=(h.id+'--'+by).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_');
  const doc={hyp:h.id,gap:g.id,lang:g.lang,v,by,at:Date.now()};
  const prev=votesFor(h.id).mine;if(prev===v){doc.v='none'}
  if(store.db){try{await store.db.collection('votes').doc(id).set(doc)}catch(e){toast('Couldn’t save your answer. Check that you can edit this page.');return}}
  else{store.votes=store.votes.filter(x=>!(x.hyp===h.id&&x.by===by));store.votes.push(doc);saveLocal();refreshCommunity()}
}

function chartSVG(L,opts){const w=opts.w||380,h=opts.h||170,ml=34,mr=opts.mr??6,mt=10,mb=24;const SER=L.series.slice(0,1),all=SER.flatMap(s=>s.pts.map(p=>p.v));
  const lo=Math.pow(10,Math.floor(Math.log10(Math.min(...all)*.8))),hi=Math.pow(10,Math.ceil(Math.log10(Math.max(...all)*1.1)));
  const X=y=>ml+(y-Y0)/(Y1-Y0)*(w-ml-mr),Yv=v=>mt+(1-(Math.log10(v)-Math.log10(lo))/(Math.log10(hi)-Math.log10(lo)))*(h-mt-mb);
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Speakers of ${L.name} over time, log scale">`;
  for(let v=lo;v<=hi;v*=10){s+=`<line x1="${ml}" x2="${w-mr}" y1="${Yv(v)}" y2="${Yv(v)}" stroke="${C.line}"/><text x="${ml-6}" y="${Yv(v)+3.5}" text-anchor="end">${v>=1e6?v/1e6+'M':v>=1e3?v/1e3+'k':v}</text>`}
  for(const yy of[1850,1900,1950,2000])s+=`<text x="${X(yy)}" y="${h-6}" text-anchor="middle">${yy}</text>`;
  const up=opts.upTo||Y1;const col=C[L.color.slice(2)];const gapIds=new Set(L.gapList.map(g=>g.id));
  s+=`<defs><clipPath id="clip${opts.id}"><rect x="0" y="0" width="${X(up)+6}" height="${h}" class="reveal"/></clipPath></defs><g clip-path="url(#clip${opts.id})">`;
  SER.forEach((se,si)=>{const p=se.pts;const c=col;
    for(let i=1;i<p.length;i++){const a=p[i-1],b=p[i];const dashed=false;
      s+=`<line x1="${X(a.y)}" y1="${Yv(a.v)}" x2="${X(b.y)}" y2="${Yv(b.v)}" stroke="${c}" stroke-width="1.6" ${dashed?'stroke-dasharray="2 4" stroke-linecap="round"':''}/>`}
    for(const q of p)s+=`<circle cx="${X(q.y)}" cy="${Yv(q.v)}" r="3" fill="${c}"/>`;
    });
  s+='</g>';if(opts.yearLine)s+=`<line class="yl" data-x0="${ml}" data-x1="${w-mr}" x1="${X(S.year)}" x2="${X(S.year)}" y1="${mt}" y2="${h-mb}" stroke="${C.accent}" stroke-width="1"/>`;
  return s+'</svg>'}

  el.querySelector('#sClose').onclick=closeStory;el.querySelector('#sBack').onclick=closeStory;el.querySelector('#sAdd').onclick=()=>openForm({lang:id});el.querySelector('#sOther').onclick=()=>openStory(other);
  el.querySelectorAll('[data-opengap]').forEach(b=>b.onclick=()=>openGap(L.gapList.find(g=>g.id===b.dataset.opengap)));renderGaps(L,el.querySelector('#sGaps'));
  SX.cv=el.querySelector('.sx-map');SX.ctx=SX.cv.getContext('2d');WX.mount(el);SONG.mount(el);initSig(el);
  SX.ro&&SX.ro.disconnect();SX.ro=new ResizeObserver(()=>{storyMeasure();storyTick()});SX.ro.observe(el.querySelector('.sx-stage'));
  el.onscroll=()=>{if(!SX.raf)SX.raf=requestAnimationFrame(()=>{SX.raf=0;storyTick()})};storyMeasure();storyTick()}
function storyMeasure(){const el=SX.el;if(!el||el.hidden)return;const r=SX.cv.getBoundingClientRect();const dpr=Math.min(2,devicePixelRatio||1);SX.W=r.width;SX.H=r.height;
  SX.cv.width=r.width*dpr;SX.cv.height=r.height*dpr;SX.ctx.setTransform(dpr,0,0,dpr,0,0);WX.size();
  const base=el.getBoundingClientRect().top-el.scrollTop;SX.tops=[...el.querySelectorAll('.sx-step')].map(s=>{const b=s.getBoundingClientRect();return{top:b.top-base,h:b.height}})}
function storyTick(){const el=SX.el;if(!el||el.hidden||!SX.tops.length)return;const vh=el.clientHeight,y=el.scrollTop+vh*.5;
  let i=0;for(let k=0;k<SX.tops.length;k++)if(SX.tops[k].top<=y)i=k;const p=clamp01((y-SX.tops[i].top)/SX.tops[i].h);const s=SX.steps[i];
  if(i!==SX.i){SX.i=i;el.querySelectorAll('.sx-scene').forEach(n=>n.classList.toggle('on',+n.dataset.sc===i));el.querySelector('.sx-hud').classList.toggle('off',s.t!=='map');WX.setActive(s.t==='wa');if(s.t!=='song'&&window.SONG)SONG.leave()}
  if(s.t==='wa')WX.apply(clamp01((el.scrollTop-SX.tops[i].top)/Math.max(1,SX.tops[i].h-vh)));
  el.querySelector('.prog').style.width=(el.scrollTop/Math.max(1,el.scrollHeight-vh)*100)+'%';
  const sc=el.querySelector(`.sx-scene[data-sc="${i}"]`);
  if(s.t==='map'||(sc&&s.t==='gap')||!sc)drawStoryMap(camAt(i,p));
  if(!sc)return;
  if(s.t==='school'){sc.querySelectorAll('.it').forEach((n,j)=>{const t=reduce?(p>.12+j*.14?1:0):smooth((p-.1-j*.17)/.1);n.style.opacity=t;n.style.transform=`translateY(${(1-t)*14}px)`})}
  if(s.t==='photo'&&s.src){}
  else if(s.t==='photo'){const kb=sc.querySelector('.kb'),k=s.ken||[0,0];if(!reduce)kb.style.transform=`scale(${1.04+.16*p}) translate(${(p-.5)*k[0]}%,${(p-.5)*k[1]+(s.hero?p*6:0)}%)`;
    const a=sc.querySelector('.ann');if(a){const t=reduce?(p>.3?1:0):smooth((p-.3)/.18);a.querySelector('circle').setAttribute('stroke-dashoffset',100*(1-t));a.querySelector('.lb').style.opacity=t>=1?1:0}}
  if(s.t==='news'){const f=sc.querySelector('.sx-fig'),pr=clamp01((el.scrollTop-SX.tops[i].top)/Math.max(1,SX.tops[i].h-vh));f.style.transform=`translateY(${-pr*Math.max(0,f.offsetHeight-vh)}px)`}
  if(s.t==='chapter'&&!reduce){sc.querySelector('.big').style.transform=`translateY(${(.5-p)*28}vh)`;sc.querySelector('.ti').style.transform=`translateY(${(.5-p)*10}vh)`}
  if(s.t==='doc'){const z=reduce?1:1+.22*smooth((p-.12)/.45);sc.querySelector('.paper').style.transform=`scale(${z})`;
    sc.querySelectorAll('mark').forEach((m,j)=>m.style.backgroundSize=`${(reduce?(p>.2?1:0):smooth((p-.2-j*.1)/.1))*100}% 100%`);
    sc.querySelectorAll('.note').forEach((n,j)=>{const t=reduce?(p>.3?1:0):smooth((p-.45-j*.08)/.08);n.style.opacity=t;n.style.transform=`translateX(${(1-t)*-10}px)`})}
  if(s.t==='gap'){const n=sc.querySelector('.yrs');const N=+n.dataset.n;n.textContent=reduce?N:Math.round(N*smooth(p/.3));
    sc.querySelector('svg.line line').setAttribute('stroke-dashoffset',0);
    sc.querySelectorAll('.hyp').forEach((h,j)=>{const t=reduce?1:smooth((p-.25-j*.09)/.08);h.style.opacity=t;h.style.transform=`translateY(${(1-t)*14}px)`})}}
function closeStory(){const el=$('#story');WX.setActive(false);window.SONG&&SONG.leave();el.classList.add('fade');SX.ro&&SX.ro.disconnect();el.onscroll=null;setTimeout(()=>{el.hidden=true;el.innerHTML='';SX.el=null},600);document.body.style.overflow=''}

/* ============ Wā: first-person time, then the 1885 map of Maui cut by survey lines (a scroll step in the Hawaiian story) ============ */
const WX=(()=>{const IW=1920,IH=1531,SRC='img/maui-1885-clean.jpg',LINES='img/maui-1885-lines.png';
  let sc,a1,rc,rg,stage,cards,lines,yrEl,W=0,H=0,sw=0,sh=0,run=false,t0=0,last=0,zc=0,boost=0,col='#999';
  const pts=Array.from({length:90},()=>({x:(Math.random()*2-1)*7,z:Math.random(),w:.6+Math.random()*.8}));
  const ridge=Array.from({length:30},(_,i)=>{const x=i/29;return[x,.25+.75*Math.abs(Math.sin(i*2.3)*Math.cos(i*.7))*Math.max(.25,1-Math.abs(x-.5)*1.6)]});
  // only the map's own survey lines (img/maui-1885-lines.png) are shown; nothing is drawn over the source
  function mount(el){sc=el.querySelector('.sx-wa');if(!sc)return;run=false;a1=sc.querySelector('.a1');rc=sc.querySelector('.wa-rays');rg=rc.getContext('2d');stage=sc.querySelector('.m2-stage');cards=[...sc.querySelectorAll('.m2-c')];yrEl=sc.querySelector('.m2-yr');
    stage.innerHTML=`<img src="${SRC}" alt="Hawaiian Government Survey map of Maui, 1885"><img class="m2-lines" src="${LINES}" alt="" aria-hidden="true">`;
    lines=stage.querySelector('.m2-lines');
    size();apply(0)}
  function size(){if(!sc)return;const d=Math.min(devicePixelRatio||1,2);W=sc.clientWidth;H=sc.clientHeight;if(!W)return;
    rc.width=W*d;rc.height=H*d;rg.setTransform(d,0,0,d,0,0);col=getComputedStyle(document.documentElement).getPropertyValue('--muted').trim()||'#999'}
  // Act 1: a one-point-perspective ground; lines and dots recede toward the horizon, as if stepping backward
  function drawGround(t){const g=rg;g.clearRect(0,0,W,H);
    const dt=last?Math.min(.05,(t-last)/1000):0;last=t;boost*=Math.pow(.18,dt);zc+=(.05+boost)*dt;
    const ease=Math.min(1,(t-t0)/1200),cx=W/2,hy=H*.42,hg=H-hy,f=Math.max(W,H*1.2)*.11,rx=Math.min(400,W*.42),ry=Math.min(210,H*.36);
    const Z=zr=>hy+hg/zr;
    const pull=1/(1+zc*.05);g.strokeStyle='rgba(0,0,0,.14)';g.lineWidth=1;g.globalAlpha=ease;g.beginPath();g.moveTo(0,hy);g.lineTo(W,hy);g.stroke();
    g.fillStyle='rgba(0,0,0,.13)';g.beginPath();g.moveTo(0,hy);for(const[rx0,rh]of ridge)g.lineTo(cx+(rx0-.5)*W*1.15*pull,hy-rh*H*.13*pull);g.lineTo(cx+.575*W*1.15*pull,hy);g.closePath();g.fill();
    const gr=g.createLinearGradient(0,hy,0,H);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.2)');g.strokeStyle=gr;g.setLineDash([1.5,5]);g.lineCap='round';
    g.beginPath();for(let i=-16;i<=16;i++){const x=i*1.1;g.moveTo(cx,hy);g.lineTo(cx+x/.7*f,Z(.7))}g.stroke();g.setLineDash([]);
    const sp=.55,u=(zc/sp)%1;for(let k=0;k<26;k++){const zr=.8+(k+u)*sp*(1+k*.04),y=Z(zr),a=Math.min(1,(zr-.8)/.5)*Math.min(1,2.2/zr)*.17*ease;if(a<.004)continue;g.strokeStyle=`rgba(0,0,0,${a})`;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
    g.fillStyle=col;for(const p of pts){const q=((p.z+zc*.22)%1+1)%1,zr=.9+q*q*14,x=cx+p.x/zr*f,y=Z(zr);if(x<-4||x>W+4)continue;
      const d=Math.hypot((x-cx)/rx,(y-H/2)/ry),a=Math.min(1,(zr-.9)/.6)*Math.min(1,(1-q)*3)*Math.min(1,(d-1)/.4)*.7*ease;if(a<=.01)continue;g.globalAlpha=a;g.beginPath();g.arc(x,y,Math.max(.5,2.2*p.w/Math.pow(zr,.8)),0,7);g.fill()}
    g.globalAlpha=1}
  function loop(t){if(!run)return;drawGround(t);requestAnimationFrame(loop)}
  function setActive(on){if(!sc||on===run)return;run=on;if(on){if(!W)size();t0=performance.now();last=0;boost=0;reduce?drawGround(t0+3000):requestAnimationFrame(loop)}}
  const ramp=(p,a,b)=>smooth((p-a)/(b-a));
  // Act 2, driven by the scroll progress p (0–1) of the step: the map settles in clean, then its survey lines spread out from the crater
  function apply(p){if(!sc)return;if(!W)size();if(!W)return;
    const f=ramp(p,.1,.24);a1.style.opacity=1-f;a1.style.transform=`translateY(${-f*70}px)`;a1.style.visibility=f>=1?'hidden':'visible';
    const e=ramp(p,.16,.3);stage.style.opacity=e;stage.style.transform=`translate(-50%,-50%) scale(${.92+.08*e})`;
    const q=(p-.48)/.4;lines.style.setProperty('--r',(ramp(q,0,.7)*150).toFixed(1)+'%');
    yrEl.style.opacity=ramp(p,.26,.34);
    const c=[ramp(p,.28,.34)*(1-ramp(p,.44,.5)),ramp(p,.5,.56)];
    cards.forEach((el,i)=>{el.style.opacity=c[i];el.style.transform=`translateY(${(1-c[i])*14}px)`})}
  return{mount,size,apply,setActive,wheel(e){if(run)boost=Math.min(.6,boost+Math.abs(e.deltaY)*.0012)}}})();
$('#story').addEventListener('wheel',e=>WX.wheel(e),{passive:true});

/* ---- 1897 petition: add your own name to the roll ---- */
function initSig(el){const card=el.querySelector('.sig');if(!card)return;
  const cv=card.querySelector('.sig-cv'),g=cv.getContext('2d'),inp=card.querySelector('.sig-in'),fb=card.querySelector('.sig-fb'),pg=el.querySelector('.pg2'),nm=pg.querySelector('.pet-name'),cnt=card.closest('.sx-card').querySelector('.pcount');
  let mode='draw',ink=0,drawing=false,lx=0,ly=0;
  function fit(){const r=cv.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);if(!r.width)return;cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);g.lineWidth=2.2;g.lineCap=g.lineJoin='round';g.strokeStyle='#23263f';ink=0}
  new ResizeObserver(fit).observe(cv);fit();
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.addEventListener('pointerdown',e=>{drawing=true;[lx,ly]=pt(e);cv.setPointerCapture(e.pointerId);g.beginPath();g.arc(lx,ly,1.1,0,7);g.fillStyle='#23263f';g.fill();ink++;e.preventDefault()});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const[x,y]=pt(e);g.beginPath();g.moveTo(lx,ly);g.lineTo(x,y);g.stroke();lx=x;ly=y;ink++});
  const up=()=>{drawing=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  card.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;card.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));cv.hidden=mode!=='draw';inp.hidden=mode!=='type';if(mode==='type')inp.focus()});
  const total=n=>{cnt.textContent=n.toLocaleString('en-US')};
  function clear(){g.clearRect(0,0,cv.width,cv.height);ink=0;inp.value='';pg.classList.remove('signed');nm.innerHTML='';fb.textContent='';total(21269)}
  card.querySelector('[data-a=clear]').onclick=clear;
  card.querySelector('[data-a=inscribe]').onclick=()=>{
    if(mode==='draw'){if(ink<2){fb.textContent='Sign in the box first, or switch to Type.';return}
      const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;o.getContext('2d').drawImage(cv,0,0);nm.innerHTML='';const im=new Image();im.src=o.toDataURL('image/png');im.alt='Your signature';nm.appendChild(im)}
    else{const t=inp.value.trim();if(!t){fb.textContent='Type your name first.';return}nm.textContent=t;nm.style.fontSize=Math.max(14,nm.offsetHeight*.7)+'px'}
    pg.classList.remove('signed');void pg.offsetWidth;pg.classList.add('signed');total(21270);fb.textContent='Your name is inscribed alongside the 21,269 ancestors.'}}

/* ---- song lesson: listen, record, upload to the timeline ---- */
window.SONG=(()=>{let rec=null,chunks=[],stream=null,blob=null,timer=0,t0=0,url='';
  const q=(r,sel)=>r.querySelector(sel);
  function root(){return document.querySelector('.sx-song')}
  function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
  function leave(){const r=root();if(!r)return;const a=q(r,'.sg-audio'),t=q(r,'.sg-take');a&&a.pause();t&&t.pause();if(rec&&rec.state==='recording')rec.stop();stopTracks();clearInterval(timer)}
  function mount(el){const r=el.querySelector('.sx-song');if(!r)return;const b=n=>q(r,`[data-r=${n}]`),fb=q(r,'.rfb'),tk=q(r,'.sg-take'),tm=q(r,'.rtime');
    const reset=()=>{blob=null;if(url)URL.revokeObjectURL(url);url='';tk.hidden=true;tk.removeAttribute('src');b('up').hidden=true;b('drop').hidden=true;b('rec').hidden=false;b('stop').hidden=true;b('rec').classList.remove('rec-on');tm.textContent=''};
    b('rec').onclick=async()=>{q(r,'.sg-audio').pause();fb.textContent='';
      if(!navigator.mediaDevices||!window.MediaRecorder){fb.textContent='Recording is not supported here (it needs https or localhost). Choose an audio file instead.';return}
      try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){fb.textContent='The microphone is blocked here. Open this page in Chrome, Edge or Safari and allow the microphone, or choose an audio file instead.';toast('Microphone blocked. You can choose an audio file instead.');return}
      chunks=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
      rec.onstop=()=>{clearInterval(timer);stopTracks();blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);tk.src=url;tk.hidden=false;b('stop').hidden=true;b('rec').hidden=false;b('rec').classList.remove('rec-on');b('up').hidden=false;b('drop').hidden=false;fb.textContent='Play it back, then upload or record again.'};
      rec.start();t0=Date.now();b('rec').hidden=true;b('stop').hidden=false;b('up').hidden=true;b('drop').hidden=true;tk.hidden=true;timer=setInterval(()=>{const sec=Math.round((Date.now()-t0)/1000);tm.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');if(sec>=60)rec.stop()},250)};
    q(r,'.rfile input').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;if(f.size>600000&&!store.assets){fb.textContent='That file is too big to keep here. Choose a shorter one.';return}
      blob=f;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(f);tk.src=url;tk.hidden=false;b('up').hidden=false;b('drop').hidden=false;fb.textContent='Play it back, then upload.'};
    b('stop').onclick=()=>{if(rec&&rec.state==='recording')rec.stop()};
    b('drop').onclick=()=>{reset();fb.textContent=''};
    b('up').onclick=async()=>{if(!blob)return;const btn=b('up');btn.disabled=true;btn.textContent='Uploading…';
      const L=LANGS.haw,doc={lang:'haw',langName:L.name,gap:'',connection:'I’m learning it',year:'',title:'Singing Ke ʻAla Tuberose',text:'A recording of Ke ʻAla Tuberose, sung after the Ka Leo o ke Mele lesson.',by:store.me||'local',at:Date.now()};
      const ext=/mp4|m4a|mpeg|mp3/.test(blob.type)?(/mpeg|mp3/.test(blob.type)?'mp3':'m4a'):/ogg/.test(blob.type)?'ogg':/wav/.test(blob.type)?'wav':'webm',f=blob instanceof File?blob:new File([blob],'ke-ala-tuberose.'+ext,{type:blob.type});
      let ok=true;
      if(store.assets){try{const x=await store.assets.upload(f);doc.audio=x.id}catch(e){ok=false;fb.textContent='The recording couldn’t be uploaded.'}}
      else if(f.size<600000){doc.audio=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f)})}
      else{ok=false;fb.textContent='That recording is too long to keep here. Try a shorter take.'}
      if(ok){try{if(store.db)await store.db.collection('stories').add(doc);else{store.stories.push({...doc,id:'l'+Date.now()});saveLocal()}
        reset();fb.textContent='Thank you. Your recording is on the Hawaiian timeline.';toast('Added to the Hawaiian timeline');refreshCommunity()}
        catch(e){ok=false;fb.textContent='Couldn’t save. You may only have view access to this page.'}}
      btn.disabled=false;btn.textContent='Upload to the timeline'}}
  return{mount,leave}})();
